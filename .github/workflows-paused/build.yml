# PARKED by L598: this repository is canonical on the fleet's forge now, and
# its gate is `.forgejo/workflows/gate.yaml`. GitHub Actions never reads a
# workflow outside `.github/workflows/`, so moving this file here is what
# disables it; nothing here is ported because `nix flake check` (the new
# gate's one command) already builds this crate through the flake's own
# `checks.package` derivation.
name: 🛠️ Build
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 🛠️ Build
        run: cargo build --verbose
