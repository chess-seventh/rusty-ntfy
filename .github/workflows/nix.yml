name: ❄️ Nix
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: 🔎 nix flake check
        run: nix flake check -L
